
name: Build Benjah OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Show Java version
        run: java -version

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Pro debug APK
        run: ./gradlew --no-daemon :app:assembleProDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Benjah_OS_v1-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
